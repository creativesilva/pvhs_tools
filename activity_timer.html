<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PVHS Tools">
  <meta name="theme-color" content="#007474">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="PV_AppIcon.png">
  <link rel="icon" type="image/png" href="PV_AppIcon.png">
  <title>Activity Timer</title>

  <style>
    /* DSEG7 Classic — self-hosted, SIL OFL 1.1 (see fonts/DSEG-LICENSE.txt).
       Real 7-segment display face, used for the countdown digits. */
    @font-face {
      font-family: 'DSEG7Classic';
      src: url('fonts/DSEG7Classic-Bold.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --teal:#007474; --teal-bright:#4be1e1;
      --white:#f7fbfb; --muted:#cfe3e3;
      --shadow:0 20px 46px rgba(0,0,0,0.30);
      --app-spacing:16px; --radius:34px;
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0; }
    html { height:-webkit-fill-available; }
    html, body { width:100%; height:100%; min-height:100%; background:#021414; overflow:hidden; }
    body { min-height:100vh; min-height:100dvh; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
           color:var(--white); touch-action:none; user-select:none; -webkit-font-smoothing:antialiased; }

    .frame { width:100%; height:100dvh; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:10px; }
    .app {
      width:430px; height:880px; max-width:100%; max-height:100%;
      border-radius:var(--radius); overflow:hidden; position:relative;
      box-shadow:var(--shadow); border:1px solid rgba(255,255,255,0.12);
      background:linear-gradient(168deg, rgba(6,28,28,0.97) 0%, rgba(4,24,24,0.95) 30%, rgba(0,72,72,0.92) 60%, rgba(0,100,100,0.96) 82%, rgba(4,30,30,0.97) 100%);
      display:flex; flex-direction:column; padding:14px var(--app-spacing) var(--app-spacing);
      transition:background 0.4s ease;
    }
    .app::before {
      content:""; position:absolute; inset:0; pointer-events:none;
      background: radial-gradient(ellipse at 50% 20%, rgba(0,116,116,0.18) 0%, transparent 60%),
                  radial-gradient(circle at center, rgba(255,255,255,0.03) 0%, transparent 50%);
      z-index:0;
    }
    .ghost-logo { position:absolute; top:56%; left:50%; width:85%; opacity:0.05; transform:translate(-50%,-50%); filter:grayscale(100%); pointer-events:none; z-index:0; }
    .content { position:relative; z-index:1; width:100%; flex:1; min-height:0; display:flex; flex-direction:column; overflow:hidden; }

    /* Top row */
    .top-row { display:flex; align-items:center; justify-content:space-between; width:100%; gap:10px; height:44px; flex-shrink:0; margin-bottom:8px; position:relative; }
    .logo-clear { width:38px; height:38px; object-fit:contain; filter:drop-shadow(0 8px 18px rgba(0,0,0,0.24)); }
    .page-title { position:absolute; left:0; right:0; text-align:center; font-size:15px; font-weight:700; color:#dff7f7; text-transform:uppercase; margin:0; letter-spacing:0.14em; pointer-events:none; }
    .nav-menu-btn { appearance:none; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.13); border-radius:12px; color:rgba(255,255,255,0.92); width:34px; height:34px; font-size:14px; font-weight:900; display:flex; align-items:center; justify-content:center; cursor:pointer; }

    /* Nav dropdown */
    .nav-menu { position:fixed; z-index:9999; min-width:180px; background:rgba(3,20,20,0.58); border:1px solid rgba(255,255,255,0.16); border-radius:16px; padding:5px; box-shadow:0 14px 44px rgba(0,0,0,0.52); backdrop-filter:blur(26px); -webkit-backdrop-filter:blur(26px); transform-origin:top right; transform:scale(0.88) translateY(-8px); opacity:0; pointer-events:none; transition:opacity 0.17s ease, transform 0.19s cubic-bezier(0.34,1.4,0.64,1); }
    .nav-menu.is-open { opacity:1; transform:scale(1) translateY(0); pointer-events:auto; }
    .nav-menu-item { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:11px; text-decoration:none; color:#eaf8f8; background:transparent; font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.12em; border:none; cursor:pointer; width:100%; }
    .nav-menu-item:active { background:rgba(255,255,255,0.1); }
    .nav-menu-icon { font-size:14px; }

    /* Views */
    .at-view { flex:1; min-height:0; display:flex; flex-direction:column; overflow:hidden; }
    .at-view[hidden] { display:none; }

    /* ── HOME VIEW ────────────────────────────────────────── */
    /* Hero uses a 1-cell grid so the "thanks to Sharon" overlay and the
       normal hero stack on top of each other and cross-fade without
       collapsing the layout. Both children share grid-area "stack". */
    .at-hero {
      display:grid; grid-template-areas:"stack";
      text-align:center; padding:14px 12px 8px; flex-shrink:0;
    }
    .at-hero-thanks, .at-hero-main {
      grid-area:stack;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      transition:opacity 0.6s ease;
    }
    .at-hero-thanks { opacity:1; }
    .at-hero-main   { opacity:0; pointer-events:none; }
    .at-hero.is-flipped .at-hero-thanks { opacity:0; pointer-events:none; }
    .at-hero.is-flipped .at-hero-main   { opacity:1; pointer-events:auto; }

    /* Thanks contents */
    .at-thanks-icon { font-size:42px; line-height:1; margin-bottom:8px; filter:drop-shadow(0 6px 18px rgba(75,225,225,0.4)); }
    .at-thanks-pre  { font-size:11px; color:var(--muted); font-weight:600; letter-spacing:0.08em; opacity:0.85; text-transform:uppercase; }
    .at-thanks-name { font-size:20px; font-weight:900; color:#fff; margin:5px 0 3px; letter-spacing:0.01em; }
    .at-thanks-post { font-size:11px; color:var(--muted); font-weight:600; letter-spacing:0.06em; opacity:0.85; }

    /* Main hero contents (unchanged look, just wrapped) */
    .at-emoji { font-size:52px; line-height:1; filter:drop-shadow(0 8px 24px rgba(75,225,225,0.35)); }
    .at-hero-main h1 { font-size:22px; font-weight:900; letter-spacing:0.02em; margin:8px 0 2px; color:#fff; }
    .at-hero-sub { font-size:11px; color:var(--muted); font-weight:600; letter-spacing:0.06em; opacity:0.85; }

    /* ── WHEEL PICKER (iOS-style scroll-snap) ────────────── */
    /* Compact: 130px tall shows ~3 items, plenty for a granular 1–30 range. */
    .at-picker { flex-shrink:0; display:flex; flex-direction:column; align-items:center; padding:2px 6px 4px; }
    .at-picker-label { font-size:10px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:0.18em; opacity:0.75; margin-bottom:6px; }
    .tp-wheel-frame {
      position:relative;
      width:min(200px, 62vw);
      height:130px;
      border-radius:18px;
      background:rgba(255,255,255,0.06);
      border:1px solid rgba(255,255,255,0.14);
      overflow:hidden;
      box-shadow:inset 0 2px 12px rgba(0,0,0,0.35);
    }
    .tp-wheel-highlight {
      position:absolute; left:10px; right:10px;
      top:50%; height:36px; transform:translateY(-50%);
      border-top:1px solid rgba(75,225,225,0.28);
      border-bottom:1px solid rgba(75,225,225,0.28);
      background:linear-gradient(180deg, rgba(75,225,225,0.06), rgba(75,225,225,0.02));
      pointer-events:none; z-index:2;
      border-radius:8px;
    }
    .tp-wheel-mask {
      position:absolute; left:0; right:0; height:44px;
      pointer-events:none; z-index:3;
    }
    .tp-wheel-mask-top { top:0;    background:linear-gradient(to bottom, rgba(4,24,24,0.9), transparent); }
    .tp-wheel-mask-bot { bottom:0; background:linear-gradient(to top,    rgba(4,24,24,0.9), transparent); }

    .tp-wheel {
      width:100%; height:100%;
      overflow-y:scroll;
      scroll-snap-type:y mandatory;
      -webkit-overflow-scrolling:touch;
      /* (frame_h - item_h) / 2 = (130-36)/2 = 47 → padding so first/last items can center */
      padding:47px 0;
      scrollbar-width:none;
      overscroll-behavior:contain;
    }
    .tp-wheel::-webkit-scrollbar { display:none; }
    .tp-item {
      height:36px;
      display:flex; align-items:center; justify-content:center;
      scroll-snap-align:center; scroll-snap-stop:always;
      font-size:18px; font-weight:800;
      color:rgba(255,255,255,0.35);
      transition:color 0.18s, font-size 0.18s, transform 0.18s;
      letter-spacing:-0.005em;
    }
    .tp-item.is-selected {
      color:#fff;
      font-size:24px;
      font-weight:900;
      transform:scale(1.02);
    }
    .tp-wheel-unit {
      margin-top:6px;
      font-size:10.5px; font-weight:800;
      color:var(--muted); letter-spacing:0.18em; text-transform:uppercase;
    }

    /* Activity name text field — label centered above the input per Chris */
    .at-field { padding:12px 6px 0; flex-shrink:0; }
    .at-field-label { display:block; font-size:10px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:0.14em; margin-bottom:6px; opacity:0.85; text-align:center; }
    .at-input {
      width:100%; padding:13px 16px;
      border-radius:14px; border:1px solid rgba(255,255,255,0.14);
      background:rgba(255,255,255,0.06); color:#f7fbfb;
      font-size:14px; font-weight:700; font-family:inherit;
      outline:none;
      transition:background 0.18s, border-color 0.18s;
    }
    .at-input:focus { background:rgba(255,255,255,0.1); border-color:rgba(75,225,225,0.4); }
    .at-input::placeholder { color:rgba(255,255,255,0.32); font-weight:500; font-style:italic; }

    .at-start-wrap { padding:14px 8px 6px; margin-top:auto; flex-shrink:0; }
    .at-start { appearance:none; width:100%; padding:16px; border-radius:16px; border:1px solid rgba(75,225,225,0.4); background:linear-gradient(180deg, rgba(0,180,180,0.35), rgba(0,140,140,0.25)); color:#fff; font-size:15px; font-weight:900; letter-spacing:0.14em; text-transform:uppercase; cursor:pointer; box-shadow:0 8px 24px rgba(0,140,140,0.24); }
    .at-start:active { transform:scale(0.98); }

    /* ── RUN VIEW (full-screen countdown w/ DSEG7 digits) ── */
    .at-run { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px 6px; }
    .at-ring-wrap { position:relative; width:min(320px, 82vw); aspect-ratio:1/1; margin:6px 0 22px; display:flex; align-items:center; justify-content:center; }
    .at-ring { position:absolute; inset:0; transform:rotate(-90deg); }
    .at-ring-track { fill:none; stroke:rgba(255,255,255,0.08); stroke-width:8; }
    .at-ring-fill {
      fill:none;
      /* stroke + filter are set by JS via inline style — CSS class rules would
         out-specify the SVG `stroke=""` attribute, so we skip the class value
         and let applyRingColor() write inline styles instead. */
      stroke-width:10; stroke-linecap:round;
      transition:stroke-dashoffset 0.5s linear, stroke 0.5s ease, filter 0.5s ease;
    }

    /* Digital-clock digits + task-name label, both inside the ring */
    .at-ring-center {
      position:absolute; inset:0;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      pointer-events:none;
    }
    .at-clock {
      position:relative;
      font-family:'DSEG7Classic', 'Courier New', ui-monospace, monospace;
      font-weight:700;
      font-size:clamp(46px, 15vw, 78px);
      line-height:1;
      letter-spacing:0.02em;
      color:#4be1e1;
      text-shadow:0 0 22px rgba(75,225,225,0.55), 0 0 4px rgba(75,225,225,0.35);
    }
    .at-clock-ghost {
      position:absolute; inset:0;
      display:flex; align-items:center; justify-content:center;
      color:rgba(75,225,225,0.09);
      text-shadow:none;
      pointer-events:none;
    }
    .at-clock-live {
      position:relative; z-index:1;
      display:flex; align-items:center; justify-content:center;
    }
    .at-clock-label {
      /* Always says 'Time Remaining' (or 'Time's Up' on finish) —
         the custom task title lives OUTSIDE and ABOVE the ring instead. */
      margin-top:10px;
      font-size:11px; font-weight:800;
      color:var(--muted); letter-spacing:0.2em; text-transform:uppercase;
      opacity:0.85;
      max-width:82%; text-align:center;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    }

    /* Custom task title (large, above the ring, outside the circle) */
    .at-task-title {
      width:100%;
      font-size:26px; font-weight:900;
      color:#fff;
      text-align:center;
      padding:2px 16px 14px;
      letter-spacing:0.01em;
      line-height:1.15;
      /* Truncate very long titles rather than wrap and push the ring down */
      max-width:100%;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
      flex-shrink:0;
    }
    /* When no task name is set, collapse the slot so the ring centers naturally */
    .at-task-title:empty { display:none; }

    .at-controls { display:flex; gap:10px; padding:12px 6px 6px; width:100%; }
    .at-ctrl { flex:1; appearance:none; padding:15px; border-radius:14px; border:1px solid rgba(255,255,255,0.14); background:rgba(255,255,255,0.06); color:#eaf8f8; font-size:12px; font-weight:900; letter-spacing:0.12em; text-transform:uppercase; cursor:pointer; }
    .at-ctrl:active { transform:scale(0.98); }
    .at-ctrl.is-primary { background:linear-gradient(180deg, rgba(0,180,180,0.4), rgba(0,140,140,0.28)); border-color:rgba(75,225,225,0.4); color:#fff; }

    /* ── DONE (0:00) STATE ────────────────────────────────── */
    .app.is-done { background:linear-gradient(168deg, rgba(0,120,120,0.98) 0%, rgba(0,180,180,0.92) 50%, rgba(0,140,140,0.96) 100%); }
    .app.is-done .at-clock { color:#ffffff; text-shadow:0 0 30px rgba(255,255,255,0.9), 0 0 6px rgba(255,255,255,0.6); }
    .app.is-done .at-clock-ghost { color:rgba(255,255,255,0.14); }
    .app.is-done .at-clock-label { color:#fff; opacity:1; }
    .at-done-pill { display:none; padding:10px 20px; border-radius:99px; background:rgba(255,255,255,0.18); border:1px solid rgba(255,255,255,0.36); color:#fff; font-size:13px; font-weight:900; letter-spacing:0.2em; text-transform:uppercase; margin-top:14px; }
    .app.is-done .at-done-pill { display:inline-flex; animation:donePulse 1.2s ease-in-out infinite; }
    @keyframes donePulse {
      0%,100% { transform:scale(1);   background:rgba(255,255,255,0.18); }
      50%     { transform:scale(1.06); background:rgba(255,255,255,0.32); }
    }

    /* Flash overlay played once at 0 */
    .at-flash { position:absolute; inset:0; background:radial-gradient(circle at 50% 50%, rgba(75,225,225,0.55) 0%, transparent 70%); opacity:0; pointer-events:none; z-index:2; }
    .at-flash.is-firing { animation:atFlash 900ms ease-out; }
    @keyframes atFlash {
      0%   { opacity:0; }
      15%  { opacity:1; }
      100% { opacity:0; }
    }

    .footer-note { text-align:center; font-size:9.5px; color:#b5d4d4; font-weight:600; padding:6px 0 2px; margin-top:auto; flex-shrink:0; opacity:0.75; }
    .footer-version { text-align:center; font-size:8.5px; color:#b5d4d4; opacity:0.55; padding:0 0 4px; font-weight:500; letter-spacing:0.04em; flex-shrink:0; }

    /* Standalone */
    body.is-standalone { background:#021414; }
    body.is-standalone::before { content:""; position:fixed; inset:0; background:#021414; pointer-events:none; z-index:0; }
    body.is-standalone .frame { position:fixed; inset:0; width:100%; height:100%; padding:0 8px max(24px,calc(env(safe-area-inset-bottom) + 8px)) 8px; z-index:1; }
    body.is-standalone .app { position:relative; width:100%; height:100%; max-width:100%; max-height:100%; border-radius:34px; padding-top:max(10px,env(safe-area-inset-top)); padding-right:max(var(--app-spacing),env(safe-area-inset-right)); padding-bottom:18px; padding-left:max(var(--app-spacing),env(safe-area-inset-left)); }
    @media (max-width:430px) {
      body:not(.is-standalone) .frame { padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom) 12px; }
      body:not(.is-standalone) .app { width:100%; height:100%; max-height:100%; border-radius:var(--radius); }
      body { touch-action:pan-y; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="app" id="atApp">
      <img class="ghost-logo" src="PV_Logo2.png" alt="">
      <div class="at-flash" id="atFlash"></div>
      <div class="content">

        <!-- Top row -->
        <div class="top-row">
          <a href="panther_toolbox.html" class="nav-link" aria-label="Back to Toolbox"><img src="PV_Logo2.png" class="logo-clear" alt="PVHS"></a>
          <h1 class="page-title">Activity Timer</h1>
          <button class="nav-menu-btn" id="navMenuBtn" type="button" aria-label="Menu">···</button>
        </div>

        <!-- HOME VIEW -->
        <div id="atHome" class="at-view">
          <!-- Hero cross-fades: 'thanks to Sharon' appears first for ~3s,
               then fades into the normal ⏱ hero. No dismiss needed. -->
          <div class="at-hero" id="atHero">
            <div class="at-hero-thanks">
              <div class="at-thanks-icon">💡</div>
              <div class="at-thanks-pre">Thanks to</div>
              <div class="at-thanks-name">Sharon Domingues</div>
              <div class="at-thanks-post">for suggesting this feature</div>
            </div>
            <div class="at-hero-main">
              <div class="at-emoji">⏱</div>
              <h1>Activity Timer</h1>
              <p class="at-hero-sub">Set duration & activity, tap start</p>
            </div>
          </div>

          <div class="at-picker">
            <div class="at-picker-label">Duration</div>
            <div class="tp-wheel-frame">
              <div class="tp-wheel-mask tp-wheel-mask-top"></div>
              <div class="tp-wheel-mask tp-wheel-mask-bot"></div>
              <div class="tp-wheel-highlight"></div>
              <div class="tp-wheel" id="tpWheel"><!-- items injected by JS --></div>
            </div>
            <div class="tp-wheel-unit">minutes</div>
          </div>

          <div class="at-field">
            <label class="at-field-label" for="atTaskInput">Activity name (optional)</label>
            <input class="at-input" id="atTaskInput" type="text"
                   placeholder="Clean up · Quiz · Log in to computers…"
                   maxlength="40" autocomplete="off" autocapitalize="sentences">
          </div>

          <div class="at-start-wrap">
            <button class="at-start" id="atStart">Start ▶</button>
          </div>
        </div>

        <!-- RUN VIEW -->
        <div id="atRun" class="at-view at-run" hidden>
          <!-- Custom task title, above the ring & OUTSIDE the circle.
               Empty → collapses; shown large + centered when set. -->
          <div class="at-task-title" id="atTaskTitle"></div>
          <div class="at-ring-wrap">
            <svg class="at-ring" viewBox="0 0 200 200" aria-hidden="true">
              <circle class="at-ring-track" cx="100" cy="100" r="88"/>
              <circle class="at-ring-fill"  cx="100" cy="100" r="88" id="atRingFill"/>
            </svg>
            <div class="at-ring-center">
              <div class="at-clock">
                <span class="at-clock-ghost" id="atGhost">88:88</span>
                <span class="at-clock-live"  id="atDigits">5:00</span>
              </div>
              <!-- Inside-ring label: ALWAYS 'Time Remaining' (or 'Time's Up' on finish). -->
              <div class="at-clock-label" id="atClockLabel">Time Remaining</div>
            </div>
          </div>
          <div class="at-done-pill">⏱ Time</div>
          <div class="at-controls">
            <button class="at-ctrl" id="atPause" type="button">Pause</button>
            <button class="at-ctrl is-primary" id="atReset" type="button">Reset</button>
          </div>
        </div>

        <div class="footer-note">By: <a href="https://www.creativesilva.com" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline">CreativeSilva</a></div>
      </div>
    </div>
  </div>

  <!-- Nav dropdown -->
  <nav class="nav-menu" id="navMenu" role="menu">
    <a href="index.html"            class="nav-menu-item" role="menuitem"><span class="nav-menu-icon">🏠</span>Home</a>
    <a href="panther_toolbox.html"  class="nav-menu-item" role="menuitem"><span class="nav-menu-icon">🧰</span>Panther Toolbox</a>
    <a href="countdown.html"        class="nav-menu-item" role="menuitem"><span class="nav-menu-icon">⏱</span>Countdown</a>
    <a href="calendar.html"         class="nav-menu-item" role="menuitem"><span class="nav-menu-icon">📅</span>Calendar</a>
    <a href="extension_search.html" class="nav-menu-item" role="menuitem"><span class="nav-menu-icon">🔍</span>Directory</a>
    <a href="panther_prompts.html"  class="nav-menu-item" role="menuitem"><span class="nav-menu-icon">❓</span>Panther Prompts</a>
    <a href="group_maker.html"      class="nav-menu-item" role="menuitem"><span class="nav-menu-icon">👥</span>Group Maker</a>
  </nav>

  <script>
    // ─────────────────────────────────────────────────────────
    // ACTIVITY TIMER · v3 · Aug 30, 2026
    //   v3 adds: activity-name text field, task name inside the
    //   ring, color-shifting ring (teal→lime→yellow→orange→red),
    //   simplified minute values (1/5/10/15/20/25/30).
    //   v2: iOS-style wheel picker + DSEG7 digits.
    // At 0: gentle two-tone chime (Web Audio, no external file)
    //       + navigator.vibrate on mobile + visual flash. Stops.
    // ─────────────────────────────────────────────────────────

    // Duration values shown in the wheel — full 1..30 min range in 1-min steps
    const MINUTES = Array.from({length: 30}, (_, i) => i + 1);
    const DUR_KEY  = 'at_duration';
    const TASK_KEY = 'at_taskname';
    const RING_C   = 2 * Math.PI * 88;   // circumference of the progress ring

    // Ring color steps. Picked so the shift is noticeable across a room
    // without hitting red until the last ~15% (Sharon's "not too obnoxious").
    // Each entry: { min: pct-remaining threshold, color, shadow }
    const RING_STOPS = [
      { min: 0.60, color: '#4be1e1', shadow: 'rgba(75,225,225,0.5)'  },  // 60–100% : bright teal
      { min: 0.40, color: '#9de24b', shadow: 'rgba(157,226,75,0.45)' },  // 40–60%  : lime
      { min: 0.25, color: '#ffce4b', shadow: 'rgba(255,206,75,0.5)'  },  // 25–40%  : yellow
      { min: 0.12, color: '#ff8a3c', shadow: 'rgba(255,138,60,0.55)' },  // 12–25%  : orange
      { min: 0.00, color: '#ff4b4b', shadow: 'rgba(255,75,75,0.65)'  }   //  0–12%  : red
    ];

    const $ = id => document.getElementById(id);
    const app = $('atApp'), home = $('atHome'), run = $('atRun');
    const digitsEl = $('atDigits'), ghostEl = $('atGhost');
    const ringFill = $('atRingFill');
    const labelEl  = $('atClockLabel');
    const titleEl  = $('atTaskTitle');
    const pauseBtn = $('atPause'), resetBtn = $('atReset');
    const flashEl  = $('atFlash');
    const wheel    = $('tpWheel');
    const taskInput= $('atTaskInput');

    // State
    let durationMin = 5;
    let durationSec = 300;
    let remainingSec = 0;
    let running = false;
    let tickId = null;
    let audioCtx = null;
    let currentStopIdx = -1;   // remember active RING_STOPS entry to avoid redundant writes

    // Standalone
    if (window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches) {
      document.body.classList.add('is-standalone');
    }

    // Restore last duration (falls back to 5 if saved value not in MINUTES)
    {
      const saved = parseInt(localStorage.getItem(DUR_KEY), 10);
      if (Number.isFinite(saved) && MINUTES.includes(saved)) {
        durationMin = saved;
        durationSec = saved * 60;
      }
    }
    // Restore last activity name (blank if none)
    taskInput.value = localStorage.getItem(TASK_KEY) || '';
    taskInput.addEventListener('input', () => {
      localStorage.setItem(TASK_KEY, taskInput.value.trim());
    });

    // Initial ring geometry
    ringFill.setAttribute('stroke-dasharray', RING_C);
    ringFill.setAttribute('stroke-dashoffset', '0');

    // ── WHEEL PICKER ──
    function buildWheel() {
      const frag = document.createDocumentFragment();
      MINUTES.forEach(m => {
        const el = document.createElement('div');
        el.className = 'tp-item';
        el.dataset.val = String(m);
        el.textContent = String(m);
        frag.appendChild(el);
      });
      wheel.appendChild(frag);
    }
    buildWheel();

    function scrollToValue(min, behavior = 'auto') {
      const item = wheel.querySelector(`.tp-item[data-val="${min}"]`);
      if (!item) return;
      const target = item.offsetTop + item.offsetHeight / 2 - wheel.clientHeight / 2;
      wheel.scrollTo({ top: target, behavior });
    }
    function updateSelectedFromScroll() {
      const items = wheel.querySelectorAll('.tp-item');
      const wr = wheel.getBoundingClientRect();
      const centerY = wr.top + wr.height / 2;
      let closest = null, closestDist = Infinity;
      items.forEach(item => {
        const r = item.getBoundingClientRect();
        const d = Math.abs(r.top + r.height / 2 - centerY);
        if (d < closestDist) { closestDist = d; closest = item; }
      });
      items.forEach(i => i.classList.toggle('is-selected', i === closest));
      if (closest) {
        const val = parseInt(closest.dataset.val, 10);
        if (val !== durationMin) {
          durationMin = val;
          durationSec = val * 60;
          localStorage.setItem(DUR_KEY, String(val));
          if (!running && run.hidden) remainingSec = durationSec;
        }
      }
    }
    let scrollRaf = null;
    wheel.addEventListener('scroll', () => {
      if (scrollRaf) return;
      scrollRaf = requestAnimationFrame(() => {
        scrollRaf = null;
        updateSelectedFromScroll();
      });
    });
    wheel.tabIndex = 0;
    wheel.addEventListener('keydown', e => {
      const currIdx = MINUTES.indexOf(durationMin);
      if (e.key === 'ArrowUp'   && currIdx > 0)                 { e.preventDefault(); scrollToValue(MINUTES[currIdx - 1], 'smooth'); }
      if (e.key === 'ArrowDown' && currIdx < MINUTES.length - 1) { e.preventDefault(); scrollToValue(MINUTES[currIdx + 1], 'smooth'); }
    });
    requestAnimationFrame(() => {
      scrollToValue(durationMin, 'auto');
      updateSelectedFromScroll();
    });

    // ── FORMAT / CLOCK ──
    function fmt(sec) {
      const s = Math.max(0, Math.round(sec));
      const m = Math.floor(s / 60);
      const r = s % 60;
      return m + ':' + String(r).padStart(2, '0');
    }
    // Ghost mirrors width of live digit slots — DSEG7's "8" is fully-lit.
    // "5:00" → "8:88";  "12:34" → "88:88".
    function ghostFor(str) {
      return str.split('').map(ch => (ch === ':' ? ':' : '8')).join('');
    }
    function renderClock() {
      const str = fmt(remainingSec);
      digitsEl.textContent = str;
      ghostEl.textContent  = ghostFor(str);
    }

    // ── RING COLOR ──
    // Reads pct-remaining, applies the matching stop's color + drop-shadow.
    // Skips writes when the stop hasn't changed → keeps the browser cheap.
    function applyRingColor(pct) {
      let idx = RING_STOPS.length - 1;
      for (let i = 0; i < RING_STOPS.length; i++) {
        if (pct >= RING_STOPS[i].min) { idx = i; break; }
      }
      if (idx === currentStopIdx) return;
      currentStopIdx = idx;
      const stop = RING_STOPS[idx];
      // Inline style so SVG presentation attribute (or missing CSS default)
      // doesn't fight us; also survives class-rule additions later.
      ringFill.style.stroke = stop.color;
      ringFill.style.filter = `drop-shadow(0 0 12px ${stop.shadow})`;
    }

    // ── CHIME ──
    function ensureAudio() {
      if (audioCtx) return audioCtx;
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      audioCtx = new Ctx();
      return audioCtx;
    }
    function playChime() {
      const ctx = ensureAudio();
      if (!ctx) return;
      const now = ctx.currentTime;
      [ [880, 0.00, 0.28],
        [587, 0.30, 0.32] ].forEach(([freq, offset, dur]) => {
        const osc  = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + offset);
        gain.gain.setValueAtTime(0.0001, now + offset);
        gain.gain.exponentialRampToValueAtTime(0.28, now + offset + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + dur);
        osc.connect(gain).connect(ctx.destination);
        osc.start(now + offset);
        osc.stop(now + offset + dur + 0.05);
      });
    }

    // ── RENDER ──
    function render() {
      renderClock();
      const pct = durationSec > 0 ? remainingSec / durationSec : 0;
      ringFill.setAttribute('stroke-dashoffset', String(RING_C * (1 - pct)));
      applyRingColor(pct);
    }

    // ── TIMING LOOP ──
    let endMs = 0, pausedMs = 0;
    function tickLoop() {
      const leftMs = Math.max(0, endMs - Date.now());
      remainingSec = leftMs / 1000;
      render();
      if (leftMs <= 0) { stopTick(); finish(); return; }
      tickId = setTimeout(tickLoop, 250);
    }
    function startTick() { stopTick(); running = true; pauseBtn.textContent = 'Pause'; tickLoop(); }
    function stopTick()  { if (tickId) { clearTimeout(tickId); tickId = null; } running = false; }

    // ── ACTIONS ──
    // Two separate slots now:
    //   setTaskTitle → the LARGE title above/outside the circle
    //   setStatusLabel → the small label INSIDE the circle (Time Remaining / Time's Up)
    function setTaskTitle(text)   { titleEl.textContent = text || ''; }
    function setStatusLabel(text) { labelEl.textContent = text; }
    function startTimer() {
      ensureAudio();
      const name = taskInput.value.trim();
      setTaskTitle(name);          // above ring (collapses when empty)
      setStatusLabel('Time Remaining');   // always this inside the ring

      remainingSec = durationSec;
      endMs = Date.now() + durationSec * 1000;
      home.hidden = true; run.hidden = false;
      app.classList.remove('is-done');
      flashEl.classList.remove('is-firing');
      currentStopIdx = -1;             // force ring color to re-apply
      render();
      startTick();
    }
    function pauseOrResume() {
      if (app.classList.contains('is-done')) return;
      if (running) {
        pausedMs = endMs - Date.now();
        stopTick();
        pauseBtn.textContent = 'Resume';
      } else {
        endMs = Date.now() + Math.max(1000, pausedMs);
        startTick();
      }
    }
    function reset() {
      stopTick();
      app.classList.remove('is-done');
      flashEl.classList.remove('is-firing');
      remainingSec = 0;
      currentStopIdx = -1;
      render();
      // Clear the run-view labels so a next Start doesn't briefly show
      // the previous task's title/status before the new one paints.
      setTaskTitle('');
      setStatusLabel('Time Remaining');
      run.hidden = true; home.hidden = false;
      pauseBtn.textContent = 'Pause';
    }
    function finish() {
      remainingSec = 0;
      render();
      flashEl.classList.add('is-firing');
      app.classList.add('is-done');
      setStatusLabel("Time's Up");   // keeps task title visible above, updates the inside label
      try { playChime(); } catch {}
      try { if ('vibrate' in navigator) navigator.vibrate([120, 60, 120]); } catch {}
      setTimeout(() => flashEl.classList.remove('is-firing'), 1000);
    }

    // ── HANDLERS ──
    $('atStart').addEventListener('click', startTimer);
    pauseBtn.addEventListener('click', pauseOrResume);
    resetBtn.addEventListener('click', reset);
    // Enter in the text field starts the timer (mouse-and-keyboard convenience)
    taskInput.addEventListener('keydown', e => { if (e.key === 'Enter') startTimer(); });

    // Nav menu
    const navMenu = $('navMenu'), navMenuBtn = $('navMenuBtn');
    navMenuBtn.addEventListener('click', e => {
      e.stopPropagation();
      const r = navMenuBtn.getBoundingClientRect();
      navMenu.style.top   = (r.bottom + 6) + 'px';
      navMenu.style.right = (window.innerWidth - r.right) + 'px';
      navMenu.classList.toggle('is-open');
    });
    document.addEventListener('click', e => {
      if (!navMenu.contains(e.target) && e.target !== navMenuBtn) navMenu.classList.remove('is-open');
    });

    // Back-to-Toolbox logo — force in-app nav for PWA
    document.querySelector('.top-row a[aria-label="Back to Toolbox"]').addEventListener('click', e => {
      e.preventDefault(); window.location.href = 'panther_toolbox.html';
    });

    // Re-render on tab restore so digits catch up to wall-clock instantly
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && running) render();
    });

    // Service worker
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});

    // Init render (idle state shows the picked duration)
    remainingSec = durationSec;
    render();

    // ── SHARON THANKS INTRO ──
    // Show the "Thanks to Sharon Domingues" panel on every page-open, then
    // cross-fade into the normal hero after ~3s. Self-dismissing; no state
    // to remember. Runs once per page load.
    setTimeout(() => {
      const hero = document.getElementById('atHero');
      if (hero) hero.classList.add('is-flipped');
    }, 3000);
  </script>
</body>
</html>
